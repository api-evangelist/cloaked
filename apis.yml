aid: cloaked
name: Cloaked
description: >-
  Cloaked is a consumer privacy and identity-protection platform that lets people
  create unlimited unique identities to shield their real personal data. Each
  identity bundles a masked email address, a virtual phone number, an auto-generated
  password, and virtual payment cards so users can sign up for services without
  handing over their real contact information. The platform adds a built-in password
  manager, AI-powered spam call screening (Call Guard), dark web and SSN monitoring,
  automated data-broker removal across 120+ sites, and up to $1M in identity theft
  insurance. Cloaked emphasizes a zero-knowledge architecture with end-to-end
  encryption and is SOC 2 Type II, ISO/IEC 27001, ISO/IEC 27701, and PCI DSS
  compliant. Backed by General Catalyst, Cloaked ships consumer apps (iOS, Android,
  web, browser extension) and a Cloaked Enterprise offering for businesses; it is
  a consumer-facing product with no publicly documented developer API at this time.
